<text x="64" y="858" class="sub">The downstream identity closes exactly: 440.4 + 396.1 + 341.0 + 184.8 = 1,362.3 mb.</text>
<text x="64" y="880" class="val">Sources: EIA February/August 2026 STEO; IEA August 2026 OMR and route commentary. July route flows are not extrapolated.</text></svg>