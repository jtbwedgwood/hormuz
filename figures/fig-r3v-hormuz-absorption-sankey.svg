<text x="64" y="68" class="title">Where the Hormuz barrels went, March-June 2026</text>
<text x="64" y="94" class="sub">August-vintage market balance; million barrels. Rerouting is upstream of the waist and is not added to downstream market clearing.</text>
<rect x="260" y="170" width="30" height="635.12" fill="#172033" opacity=".82" rx="3"/>
<text x="242" y="477.6" text-anchor="end" class="lab">Expected transit absent</text><text x="242" y="497.6" text-anchor="end" class="val">1,924.6 mb</text>
