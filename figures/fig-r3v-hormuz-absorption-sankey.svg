<rect x="790" y="355.6" width="30" height="449.6" fill="#172033" opacity=".85" rx="3"/><text x="835" y="576.3" class="lab">Net global supply loss</text><text x="835" y="597.3" class="val">1,362.3 mb · the waist</text>
